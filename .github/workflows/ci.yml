name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift-package: ${{ steps.package.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check whitespace and conflict markers
        run: python3 scripts/check_repository.py
      - name: Detect Swift package
        id: package
        shell: bash
        run: |
          if [[ -f Package.swift ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

  swift:
    name: Swift build, tests and formatting
    needs: repository
    if: needs.repository.outputs.swift-package == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Lint Swift formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run tests with coverage
        env:
          LINKWATCH_TEST_LOOPBACK: '1'
        run: swift test --parallel --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Check coverage
        run: >-
          python3 scripts/check_coverage.py "$(swift test --show-codecov-path)"
          --gate Sources/LinkWatchCore=90 --file-floor Sources/LinkWatchCore=85
          --gate Sources/LinkWatchNetworking=85 --report Sources/LinkWatchApp
      - name: Run tests with thread sanitizer
        env:
          LINKWATCH_TEST_LOOPBACK: '1'
        run: swift test --sanitize=thread --scratch-path .build/tsan
      - name: Package and verify local app
        run: bash scripts/build_app.sh

  analysis:
    name: Static analysis
    needs: repository
    if: needs.repository.outputs.swift-package == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
      PERIPHERY_VERSION: 3.8.0
      PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned SwiftLint and Periphery
        run: |
          bash scripts/install_tool.sh \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            "$SWIFTLINT_SHA256" "$RUNNER_TEMP/swiftlint"
          bash scripts/install_tool.sh \
            "https://github.com/peripheryapp/periphery/releases/download/$PERIPHERY_VERSION/periphery-$PERIPHERY_VERSION.zip" \
            "$PERIPHERY_SHA256" "$RUNNER_TEMP/periphery"
      - name: Lint with SwiftLint
        run: '"$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --quiet'
      - name: Find unused code with Periphery
        run: '"$RUNNER_TEMP/periphery/periphery" scan'

  required:
    name: CI required
    if: always()
    needs: [repository, swift, analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify all checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          HAS_PACKAGE: ${{ needs.repository.outputs.swift-package }}
        run: |
          test "$REPOSITORY_RESULT" = success
          if [ "$HAS_PACKAGE" = true ]; then
            test "$SWIFT_RESULT" = success
            test "$ANALYSIS_RESULT" = success
          else
            test "$SWIFT_RESULT" = skipped
            test "$ANALYSIS_RESULT" = skipped
          fi
