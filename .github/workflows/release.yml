name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run tests before publishing
        env:
          LINKWATCH_TEST_LOOPBACK: '1'
        run: swift test --parallel -Xswiftc -warnings-as-errors
      - name: Import optional signing identity
        # A stable identity keeps macOS Location and Local Network grants across updates.
        # Without the secrets the release is signed ad hoc and users re-grant after updating.
        env:
          SIGNING_P12: ${{ secrets.LINKWATCH_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.LINKWATCH_SIGNING_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.LINKWATCH_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$SIGNING_P12" ]]; then
            echo "No signing secret configured; the release is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$SIGNING_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          echo "LINKWATCH_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Build the app
        run: LINKWATCH_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build_app.sh
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/LinkWatch.app "LinkWatch-$version.zip"
          shasum -a 256 "LinkWatch-$version.zip" > "LinkWatch-$version.zip.sha256"
          cat > release-notes.md <<EOF
          Install or update on macOS 14 or later:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/install.sh | bash
          \`\`\`

          The installer downloads \`LinkWatch-$version.zip\`, verifies its SHA-256 checksum,
          replaces \`/Applications/LinkWatch.app\` and relaunches it. See
          [installing LinkWatch](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md)
          for manual installation, permissions and signing.
          EOF
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "LinkWatch $version" \
            --notes-file release-notes.md \
            "LinkWatch-$version.zip" "LinkWatch-$version.zip.sha256"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
