# swift-format owns layout; SwiftLint covers semantics and complexity.
included:
  - Package.swift
  - Sources
  - Tests
disabled_rules:
  - closure_parameter_position
  - line_length
  - opening_brace
  - trailing_comma
opt_in_rules:
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - private_swiftui_state
  - sorted_first_last
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition
